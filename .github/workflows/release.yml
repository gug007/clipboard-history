name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example: 0.0.27)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      DEVELOPMENT_TEAM: N7S7ZCZ5P7
      SIGN_IDENTITY: "Developer ID Application: Gurgen Abagyan (N7S7ZCZ5P7)"
      BUNDLE_ID: app.clipboard-history
      PROJECT_DIR: "Clipboard History"
      PROJECT_FILE: "Clipboard History.xcodeproj"
      SCHEME: "Clipboard History"
      APP_NAME: "Clipboard History"
      ENTITLEMENTS_FILE: "Clipboard History/Clipboard History.entitlements"
      MINIMUM_SYSTEM_VERSION: "14.0"

    steps:
      - uses: actions/checkout@v4
        with:
          # Tag releases must be checked against the complete main history.
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manual releases must run from the main branch; got '$GITHUB_REF'"
              exit 1
            fi
            REF_NAME="$DISPATCH_VERSION"
          else
            REF_NAME="$GITHUB_REF_NAME"
          fi

          VERSION="${REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must contain exactly three numeric components (for example, 0.0.27); got '$REF_NAME'"
            exit 1
          fi

          TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Release tag must be '$TAG'; got '$GITHUB_REF_NAME'"
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] \
            && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag '$TAG' must point to a commit on main"
            exit 1
          fi

          version_is_greater() {
            local candidate="$1"
            local current="$2"
            local candidate_parts
            local current_parts
            local index

            IFS='.' read -r -a candidate_parts <<< "$candidate"
            IFS='.' read -r -a current_parts <<< "$current"
            for index in 0 1 2; do
              if (( 10#${candidate_parts[$index]} > 10#${current_parts[$index]} )); then
                return 0
              fi
              if (( 10#${candidate_parts[$index]} < 10#${current_parts[$index]} )); then
                return 1
              fi
            done
            return 1
          }

          assert_newer_than() {
            local current="${1#v}"
            local source="$2"
            if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Could not validate $source version '$1'"
              exit 1
            fi
            if ! version_is_greater "$VERSION" "$current"; then
              echo "::error::Release $VERSION must be newer than $source version $current"
              exit 1
            fi
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
            TAG_LOOKUP_STATUS=$?
            set -e
            case "$TAG_LOOKUP_STATUS" in
              0)
                echo "::error::Tag '$TAG' already exists; choose a new release version"
                exit 1
                ;;
              2)
                ;;
              *)
                echo "::error::Could not verify whether tag '$TAG' already exists"
                exit "$TAG_LOOKUP_STATUS"
                ;;
            esac

          fi

          MAIN_APPCAST="$RUNNER_TEMP/main-appcast.xml"
          APPCAST_VERSION=""
          if git show origin/main:appcast.xml > "$MAIN_APPCAST" 2>/dev/null; then
            APPCAST_VERSION=$(awk -F '[<>]' \
              '/<sparkle:shortVersionString>/ { print $3; exit }' \
              "$MAIN_APPCAST")
          fi
          if [ -n "$APPCAST_VERSION" ]; then
            assert_newer_than "$APPCAST_VERSION" "appcast"
          fi

          LATEST_RELEASE_TAG=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')
          if [ -n "$LATEST_RELEASE_TAG" ]; then
            assert_newer_than "$LATEST_RELEASE_TAG" "latest GitHub release"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          rm -f "$CERT_PATH"

      - name: Build Release
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            clean build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="$MINIMUM_SYSTEM_VERSION" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            ENABLE_HARDENED_RUNTIME=YES \
            ENABLE_APP_SANDBOX=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version }}" \
            | tee xcodebuild.log | tail -20

          APP_BIN="build/Build/Products/Release/$APP_NAME.app/Contents/MacOS/$APP_NAME"
          if [ ! -f "$APP_BIN" ]; then
            echo "::error::Build produced no executable at $APP_BIN — see xcodebuild.log"
            tail -200 xcodebuild.log
            exit 1
          fi

      - name: Re-sign Sparkle frameworks
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/$APP_NAME.app"
          SPARKLE="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          ENTITLEMENTS_PATH="$PWD/$ENTITLEMENTS_FILE"

          if [ ! -f "$ENTITLEMENTS_PATH" ]; then
            echo "::error::Main app entitlements not found at $ENTITLEMENTS_PATH"
            exit 1
          fi

          if [ ! -d "$SPARKLE" ]; then
            echo "::warning::Sparkle.framework not found — skipping re-sign"
            exit 0
          fi

          sign_one() {
            codesign --force --options=runtime --timestamp \
              --sign "$SIGN_IDENTITY" "$1"
          }

          # Innermost first: XPC services
          for xpc in "$SPARKLE"/Versions/B/XPCServices/*.xpc; do
            [ -d "$xpc" ] || continue
            echo "  signing $(basename "$xpc")"
            sign_one "$xpc"
          done

          # Helper apps + bare executables next to the framework
          for helper in "$SPARKLE"/Versions/B/*.app "$SPARKLE"/Versions/B/Autoupdate; do
            [ -e "$helper" ] || continue
            echo "  signing $(basename "$helper")"
            sign_one "$helper"
          done

          # Sparkle framework itself
          echo "  signing Sparkle.framework"
          sign_one "$SPARKLE"

          # Re-seal the app bundle so its signature covers the new framework state
          echo "  re-sealing $APP_NAME.app"
          codesign --force --options=runtime --timestamp \
            --entitlements "$ENTITLEMENTS_PATH" \
            --sign "$SIGN_IDENTITY" "$APP_PATH"

          echo "==> Verifying"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -e
          APP_PATH="build/Build/Products/Release/$APP_NAME.app"
          ZIP_PATH="$RUNNER_TEMP/app.zip"
          KEY_DIR="$HOME/.private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"

          mkdir -p "$KEY_DIR"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          set +e
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$ZIP_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 30m \
            --output-format json)
          SUBMIT_EXIT=$?
          set -e

          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | /usr/bin/plutil -extract id raw -o - -- - 2>/dev/null || echo "")

          if [ -n "$SUBMISSION_ID" ]; then
            echo "::group::Notarization log for $SUBMISSION_ID"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" || true
            echo "::endgroup::"
          fi

          rm -f "$KEY_PATH" "$ZIP_PATH"

          if [ "$SUBMIT_EXIT" -ne 0 ]; then
            echo "✗ notarization failed — see log above"
            exit "$SUBMIT_EXIT"
          fi

          xcrun stapler staple "$APP_PATH"

      - name: Create DMG
        id: dmg
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          DMG_NAME="ClipboardHistory-${{ steps.version.outputs.version }}.dmg"
          bash ../scripts/create-dmg.sh "build/Build/Products/Release/$APP_NAME.app" "$DMG_NAME"
          DMG_PATH="$(pwd)/$DMG_NAME"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Sign DMG with Sparkle EdDSA key
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -e

          # Sparkle ships as a binary XCFramework, so the tool lives under artifacts/
          # in modern Xcode. Search the whole SourcePackages tree to be safe.
          SIGN_TOOL=$(find "$PROJECT_DIR/build/SourcePackages" \
            -name "sign_update" -type f 2>/dev/null | head -1)
          if [ -z "${SIGN_TOOL:-}" ]; then
            echo "::error::Sparkle's sign_update tool not found"
            echo "Searched in: $PROJECT_DIR/build/SourcePackages"
            find "$PROJECT_DIR/build/SourcePackages" -maxdepth 4 -type d 2>/dev/null | head -30
            exit 1
          fi
          echo "sign_update: $SIGN_TOOL"

          KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
          # printf '%s' avoids appending a trailing newline; strip CR/whitespace.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '\r\n\t ' > "$KEY_FILE"
          KEY_LEN=$(wc -c < "$KEY_FILE" | tr -d ' ')
          echo "key file size: $KEY_LEN bytes"

          DMG_PATH="${{ steps.dmg.outputs.dmg_path }}"
          if [ ! -f "$DMG_PATH" ]; then
            echo "::error::DMG not found at $DMG_PATH"
            exit 1
          fi

          # Capture stdout AND stderr; show both in log.
          set +e
          SIGN_OUT=$("$SIGN_TOOL" -f "$KEY_FILE" "$DMG_PATH" 2>&1)
          SIGN_RC=$?
          set -e
          rm -f "$KEY_FILE"

          echo "::group::sign_update output (rc=$SIGN_RC)"
          echo "$SIGN_OUT"
          echo "::endgroup::"

          if [ "$SIGN_RC" -ne 0 ]; then
            echo "::error::sign_update failed with exit $SIGN_RC"
            exit "$SIGN_RC"
          fi

          # Keep only the machine-readable attributes; diagnostic text must never
          # leak into the appcast enclosure element or a GitHub Actions output.
          SIG_LINE=$(printf '%s\n' "$SIGN_OUT" \
            | grep -Eo 'sparkle:edSignature="[^"]+" length="[0-9]+"' \
            | tail -1)
          if [ -z "$SIG_LINE" ]; then
            echo "::error::sign_update returned no Sparkle signature attributes"
            exit 1
          fi
          echo "signature_line=$SIG_LINE" >> "$GITHUB_OUTPUT"

      - name: Validate final DMG
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
        run: |
          set -euo pipefail

          MOUNT_POINT=$(mktemp -d "$RUNNER_TEMP/clipboard-history-dmg.XXXXXX")
          ATTACHED=0
          cleanup() {
            if [ "$ATTACHED" -eq 1 ]; then
              hdiutil detach "$MOUNT_POINT" -quiet || hdiutil detach "$MOUNT_POINT" -force -quiet || true
            fi
            rmdir "$MOUNT_POINT" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" \
            -readonly \
            -nobrowse \
            -mountpoint "$MOUNT_POINT" \
            >/dev/null
          ATTACHED=1

          APP_PATH="$MOUNT_POINT/$APP_NAME.app"
          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          MAIN_BINARY="$APP_PATH/Contents/MacOS/$APP_NAME"
          MIGRATION_PLIST="$APP_PATH/Contents/Resources/container-migration.plist"

          if [ ! -f "$MAIN_BINARY" ]; then
            echo "::error::Final DMG contains no executable at $MAIN_BINARY"
            exit 1
          fi
          if [ ! -f "$MIGRATION_PLIST" ]; then
            echo "::error::Final app is missing Contents/Resources/container-migration.plist"
            exit 1
          fi
          plutil -lint "$MIGRATION_PLIST"
          MIGRATION_SOURCE=$(/usr/libexec/PlistBuddy \
            -c "Print :Move:0" "$MIGRATION_PLIST")
          [ "$MIGRATION_SOURCE" = '${ApplicationSupport}/Clipboard History' ] || {
            echo "::error::Unexpected legacy container migration source '$MIGRATION_SOURCE'"
            exit 1
          }

          BUNDLE_IDENTIFIER=$(plutil -extract CFBundleIdentifier raw -o - "$INFO_PLIST")
          SHORT_VERSION=$(plutil -extract CFBundleShortVersionString raw -o - "$INFO_PLIST")
          BUNDLE_VERSION=$(plutil -extract CFBundleVersion raw -o - "$INFO_PLIST")
          PLIST_MIN_OS=$(plutil -extract LSMinimumSystemVersion raw -o - "$INFO_PLIST")

          [ "$BUNDLE_IDENTIFIER" = "$BUNDLE_ID" ] || {
            echo "::error::Expected bundle identifier '$BUNDLE_ID', found '$BUNDLE_IDENTIFIER'"
            exit 1
          }
          [ "$SHORT_VERSION" = "$EXPECTED_VERSION" ] || {
            echo "::error::Expected short version '$EXPECTED_VERSION', found '$SHORT_VERSION'"
            exit 1
          }
          [ "$BUNDLE_VERSION" = "$EXPECTED_VERSION" ] || {
            echo "::error::Expected bundle version '$EXPECTED_VERSION', found '$BUNDLE_VERSION'"
            exit 1
          }
          [ "$PLIST_MIN_OS" = "$MINIMUM_SYSTEM_VERSION" ] || {
            echo "::error::Expected minimum macOS '$MINIMUM_SYSTEM_VERSION', found '$PLIST_MIN_OS'"
            exit 1
          }

          version_not_newer_than() {
            local candidate="$1"
            local maximum="$2"
            local candidate_major candidate_minor candidate_patch
            local maximum_major maximum_minor maximum_patch

            IFS='.' read -r candidate_major candidate_minor candidate_patch <<< "$candidate"
            IFS='.' read -r maximum_major maximum_minor maximum_patch <<< "$maximum"
            candidate_minor="${candidate_minor:-0}"
            candidate_patch="${candidate_patch:-0}"
            maximum_minor="${maximum_minor:-0}"
            maximum_patch="${maximum_patch:-0}"

            if (( 10#$candidate_major != 10#$maximum_major )); then
              (( 10#$candidate_major < 10#$maximum_major ))
              return
            fi
            if (( 10#$candidate_minor != 10#$maximum_minor )); then
              (( 10#$candidate_minor < 10#$maximum_minor ))
              return
            fi
            (( 10#$candidate_patch <= 10#$maximum_patch ))
          }

          binary_minimum_os() {
            local architecture="$1"
            local binary="$2"
            otool -arch "$architecture" -l "$binary" | awk '
              $1 == "cmd" {
                modern = ($2 == "LC_BUILD_VERSION")
                legacy = ($2 == "LC_VERSION_MIN_MACOSX")
                next
              }
              !found && modern && $1 == "minos" { print $2; found = 1 }
              !found && legacy && $1 == "version" { print $2; found = 1 }
            '
          }

          # Every runnable Mach-O must support both advertised architectures.
          # Nested components may target an older macOS, but never a newer one
          # than the app's advertised minimum.
          MACH_O_COUNT=0
          while IFS= read -r -d '' CANDIDATE; do
            if file -b "$CANDIDATE" | grep -q "Mach-O"; then
              MACH_O_COUNT=$((MACH_O_COUNT + 1))
              BINARY_ARCHS=$(lipo -archs "$CANDIDATE")
              case " $BINARY_ARCHS " in
                *" arm64 "*) ;;
                *)
                  echo "::error::$(basename "$CANDIDATE") is missing arm64 (has: $BINARY_ARCHS)"
                  exit 1
                  ;;
              esac
              case " $BINARY_ARCHS " in
                *" x86_64 "*) ;;
                *)
                  echo "::error::$(basename "$CANDIDATE") is missing x86_64 (has: $BINARY_ARCHS)"
                  exit 1
                  ;;
              esac

              for ARCH in arm64 x86_64; do
                COMPONENT_MIN_OS=$(binary_minimum_os "$ARCH" "$CANDIDATE")
                if [ -z "$COMPONENT_MIN_OS" ]; then
                  echo "::error::Could not read $ARCH minimum OS from $CANDIDATE"
                  exit 1
                fi
                if ! version_not_newer_than "$COMPONENT_MIN_OS" "$MINIMUM_SYSTEM_VERSION"; then
                  echo "::error::$CANDIDATE ($ARCH) requires macOS $COMPONENT_MIN_OS, newer than $MINIMUM_SYSTEM_VERSION"
                  exit 1
                fi
              done
            fi
          done < <(find "$APP_PATH" -type f -perm -111 -print0)

          [ "$MACH_O_COUNT" -gt 0 ] || {
            echo "::error::Final app contains no executable Mach-O files"
            exit 1
          }

          for ARCH in arm64 x86_64; do
            BINARY_MIN_OS=$(binary_minimum_os "$ARCH" "$MAIN_BINARY")
            [ "$BINARY_MIN_OS" = "$MINIMUM_SYSTEM_VERSION" ] || {
              echo "::error::$ARCH executable targets macOS '$BINARY_MIN_OS', expected '$MINIMUM_SYSTEM_VERSION'"
              exit 1
            }
          done

          ENTITLEMENTS_DUMP="$RUNNER_TEMP/final-app-entitlements.plist"
          codesign --display --entitlements - --xml "$APP_PATH" \
            > "$ENTITLEMENTS_DUMP" 2>/dev/null

          assert_entitlement() {
            KEY="$1"
            EXPECTED="$2"
            ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$ENTITLEMENTS_DUMP" 2>/dev/null || true)
            [ "$ACTUAL" = "$EXPECTED" ] || {
              echo "::error::Entitlement '$KEY' is '$ACTUAL'; expected '$EXPECTED'"
              exit 1
            }
          }

          assert_entitlement "com.apple.security.app-sandbox" "true"
          assert_entitlement "com.apple.security.files.user-selected.read-only" "true"
          assert_entitlement "com.apple.security.files.bookmarks.app-scope" "true"
          assert_entitlement "com.apple.security.network.client" "true"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

          echo "Validated $APP_NAME $EXPECTED_VERSION:"
          echo "  bundle: $BUNDLE_IDENTIFIER"
          echo "  architectures: arm64 x86_64 ($MACH_O_COUNT Mach-O files)"
          echo "  minimum macOS: $MINIMUM_SYSTEM_VERSION"
          echo "  sandbox entitlements: present"

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.dmg_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG_NAME: ${{ steps.dmg.outputs.dmg_name }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
        run: |
          set -euo pipefail
          ASSET_INFO=$(gh api "repos/$GH_REPO/releases/tags/$TAG" \
            | jq -r --arg name "$DMG_NAME" \
              '.assets[] | select(.name == $name) | "\(.size)\t\(.state)"')

          if [ -z "$ASSET_INFO" ]; then
            echo "::error::Release $TAG has no asset named $DMG_NAME"
            exit 1
          fi

          ASSET_SIZE=$(printf '%s\n' "$ASSET_INFO" | awk -F '\t' 'NR == 1 { print $1 }')
          ASSET_STATE=$(printf '%s\n' "$ASSET_INFO" | awk -F '\t' 'NR == 1 { print $2 }')
          LOCAL_SIZE=$(stat -f '%z' "$DMG_PATH")

          [ "$ASSET_STATE" = "uploaded" ] || {
            echo "::error::Release asset state is '$ASSET_STATE', expected 'uploaded'"
            exit 1
          }
          [ "$ASSET_SIZE" = "$LOCAL_SIZE" ] || {
            echo "::error::Uploaded asset is $ASSET_SIZE bytes; local DMG is $LOCAL_SIZE bytes"
            exit 1
          }

          echo "Verified $TAG/$DMG_NAME ($ASSET_SIZE bytes) before appcast publication"

      - name: Update appcast.xml
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG_NAME: ${{ steps.dmg.outputs.dmg_name }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          SIG_LINE: ${{ steps.sparkle.outputs.signature_line }}
        run: |
          set -euo pipefail
          DOWNLOAD_URL="https://github.com/$GH_REPO/releases/download/$TAG/$DMG_NAME"
          PUB_DATE="$(date -u "+%a, %d %b %Y %H:%M:%S +0000")"
          MIN_OS="14.0"

          NEW_ITEM=$(cat <<XML
              <item>
                <title>Version $VERSION</title>
                <pubDate>$PUB_DATE</pubDate>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>$MIN_OS</sparkle:minimumSystemVersion>
                <enclosure
                  url="$DOWNLOAD_URL"
                  type="application/octet-stream"
                  $SIG_LINE />
              </item>
          XML
          )

          # Always add the item to the newest appcast from main. The tag's
          # checkout may predate one or more already-published releases.
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if git show origin/main:appcast.xml > appcast.xml 2>/dev/null; then
            :
          else
            cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Clipboard History — Updates</title>
              <link>https://github.com/$GH_REPO</link>
              <description>Latest releases of Clipboard History.</description>
              <language>en</language>
            </channel>
          </rss>
          XML
          fi

          python3 - "$NEW_ITEM" <<'PY'
          import sys, pathlib, re
          new_item = sys.argv[1]
          path = pathlib.Path("appcast.xml")
          text = path.read_text()
          if "<item>" in text:
              text = text.replace("<item>", new_item.lstrip() + "\n        <item>", 1)
          else:
              text = text.replace("</channel>", new_item + "\n  </channel>", 1)
          path.write_text(text)
          PY

          xmllint --noout appcast.xml

          echo "::group::appcast.xml"
          cat appcast.xml
          echo "::endgroup::"

      - name: Commit appcast.xml
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update the exact main revision used to generate this appcast. If
          # main advances concurrently, the push fails instead of losing data.
          NEW_APPCAST=$(mktemp)
          cp appcast.xml "$NEW_APPCAST"
          git checkout -B main origin/main
          cp "$NEW_APPCAST" appcast.xml
          rm -f "$NEW_APPCAST"

          git add appcast.xml
          if git diff --staged --quiet; then
            echo "appcast.xml unchanged"
          else
            git commit -m "release: ${{ steps.version.outputs.version }} appcast"
            git push origin main
          fi
